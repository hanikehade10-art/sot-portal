  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#2F52FF" stroke-width="8" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="#121C36" stroke="#24315A" stroke-width="4"/>

