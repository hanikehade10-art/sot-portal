  <circle cx="385" cy="290" r="10" fill="#FFC700"/>

  <!-- Faculty Text -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SOT</text>
  <text x="256" y="415" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="600" fill="#FFC700" text-anchor="middle" letter-spacing="2">FACULTY PORTAL</text>
